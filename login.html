<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | EduMentor RAG</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html">EduMentor <span>RAG</span></a>
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">&#9776;</button>
  <nav class="nav" id="menu">
    <a href="index.html">Inicio</a>
    <a href="index.html#proyecto">El proyecto</a>
    <a href="index.html#nosotros">Quiénes somos</a>
    <a href="index.html#ubicacion">Ubicación</a>
    <a href="dashboard.html" id="navPanel" hidden>Mi panel</a>
    <a href="login.html" id="navLogin" class="btn-nav">Ingresar</a>
    <a href="#" id="navSalir" class="btn-nav" hidden>Salir</a>
  </nav>
</header>
<main class="container estrecho">
  <section class="card">
    <h2>Ingresar a EduMentor RAG</h2>
    <p class="alerta" id="loginError" hidden></p>
    <form id="loginForm" class="form">
      <div class="form-group">
        <label for="correo">Correo institucional</label>
        <input class="input-control" type="email" id="correo" name="correo" required placeholder="usuario@uns.edu.pe">
      </div>
      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input class="input-control" type="password" id="clave" name="clave" required minlength="6">
        <label class="check"><input type="checkbox" id="verClave"> Mostrar contraseña</label>
      </div>
      <button type="submit" class="btn-submit">Ingresar</button>
    </form>
    <p class="nota">Cuentas de prueba: <code>docente@uns.edu.pe</code> / <code>docente123</code> &middot;
       <code>estudiante@uns.edu.pe</code> / <code>estudiante123</code></p>
  </section>
</main>
<footer class="footer">
  <p>&copy; 2026 EduMentor RAG &mdash; Grupo 03 &middot; Aplicaciones Distribuidas I &middot; Universidad Nacional del Santa</p>
</footer>
<script src="js/main.js"></script>
</body>
</html>
