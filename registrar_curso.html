<main class="container estrecho">
  <section class="card" id="registro">
    <h2>Registro de curso</h2>
    <p>El docente registra el curso para el que cargará material académico.</p>
    <form action="confirmacion.html" method="GET" class="form">
      <div class="form-group">
        <label for="docente">Nombre del docente</label>
        <input class="input-control" type="text" id="docente" name="docente" required placeholder="Ej. María Pérez">
      </div>
      <div class="form-group">
        <label for="email">Correo institucional (@uns.edu.pe)</label>
        <input class="input-control" type="email" id="email" name="email" required pattern=".+@uns\.edu\.pe" placeholder="docente@uns.edu.pe">
      </div>
      <div class="form-group">
        <label for="curso">Nombre del curso</label>
        <input class="input-control" type="text" id="curso" name="curso" required placeholder="Ej. Aplicaciones Distribuidas I">
      </div>
      <div class="form-group">
        <label for="codigo">Código del curso (6 dígitos)</label>
        <input class="input-control" type="text" id="codigo" name="codigo" required pattern="[0-9]{6}" placeholder="Ej. 123456">
      </div>
      <div class="form-group">
        <label for="ciclo">Ciclo</label>
        <select class="input-control" id="ciclo" name="ciclo" required>
          <option value="">-- Seleccione --</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </div>
      <div class="form-group">
        <label for="descripcion">Descripción del curso</label>
        <textarea class="input-control" id="descripcion" name="descripcion" rows="4" maxlength="300" required placeholder="Describe brevemente el curso..."></textarea>
        <small id="contador">0 / 300</small>
      </div>
      <button type="submit" class="btn-submit">Registrar curso</button>
    </form>
  </section>
</main>
